<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Games Intro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030305}body{font-family:Arial,Helvetica,sans-serif;color:#fff}.intro{position:fixed;inset:0;background:#030305;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvas{position:absolute;inset:0;width:100%;height:100%}.content{position:relative;z-index:2;text-align:center;opacity:0;transform:translateY(20px);}.sun{width:120px;height:120px;border-radius:50%;margin:0 auto 34px;background:radial-gradient(circle,#fff7b0 0,#ffd43b 42%,#ff9e00 72%,rgba(255,158,0,0) 73%);box-shadow:0 0 35px #ffd43b,0 0 100px #ff9e0088;transform:scale(.1);opacity:0}.small{font-size:18px;letter-spacing:7px;font-weight:700;color:#cdd2df;margin-bottom:14px}.title{font-size:clamp(54px,8vw,110px);font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#fff,#ffd43b,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}.bar{width:min(520px,70vw);height:4px;margin:28px auto 0;background:#202532;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ffd43b;box-shadow:0 0 15px #ffd43b}.fade{animation:fade 1s ease forwards 5.5s}@keyframes fade{to{opacity:0}}@keyframes sun{to{transform:scale(1);opacity:1}}@keyframes content{to{opacity:1;transform:none}}@keyframes bar{to{width:100%}}@keyframes title{to{background-position:200% center}} </style>
</head>
<body>
<div class="intro" id="intro"><canvas class="canvas" id="canvas"></canvas><div class="content" id="content"><div class="sun" id="sun"></div><div class="small">DEVELOPED BY</div><div class="title">SUNNY GAMES</div><div class="bar"><i id="bar"></i></div></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let particles=[];let start=performance.now();let audio;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function initAudio(){try{audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function tone(freq,dur,when=0,type='sine',gain=.035){if(!audio)return;const t=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.03)}
function riser(){if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(520,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+1.55)}
function impact(){tone(80,.45,0,'sine',.09);tone(180,.3,.02,'triangle',.045)}
function text1(){tone(440,.12,0,'sine',.025);tone(660,.18,.08,'sine',.025)}
function text2(){tone(520,.12,0,'sine',.025);tone(780,.22,.08,'sine',.03)}
function spawn(){particles=[];for(let i=0;i<100;i++){const a=Math.random()*Math.PI*2,s=Math.random()*2+1;particles.push({x:innerWidth/2,y:innerHeight/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*2+1,life:1})}}
function draw(now){const t=(now-start)/1000;ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=.008;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.addEventListener('DOMContentLoaded',()=>{initAudio();spawn();riser();document.getElementById('sun').style.animation='sun 1.15s cubic-bezier(.2,.8,.2,1) forwards';setTimeout(impact,1500);setTimeout(()=>{document.querySelector('.content').style.animation='content .8s ease forwards';text1()},2200);setTimeout(text2,3000);document.getElementById('bar').style.animation='bar 3.1s linear forwards';document.querySelector('.title').style.animation='title 2s linear infinite';setTimeout(()=>document.getElementById('intro').classList.add('fade'),0)});
</script>
</body>
</html>
